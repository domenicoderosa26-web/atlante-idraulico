name: Controllo Normattiva nazionale
on:
  schedule:
    - cron: '17 7,8,9 * * *'
      timezone: Europe/Rome
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: atlante-publication
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.prepare.outputs.changed }}
      skipped: ${{ steps.prepare.outputs.skipped }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Valida tassonomia e archivi
        run: python scripts/topics.py validate data.json dist/data.json
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Recupera stato tecnico e verifica idempotenza
        id: prepare
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          mkdir -p monitor-state
          if git ls-remote --exit-code origin refs/heads/normattiva-state >/dev/null; then
            git fetch origin refs/heads/normattiva-state:refs/remotes/origin/normattiva-state
            for file in checkpoint.json events.json; do
              if git cat-file -e "origin/normattiva-state:$file" 2>/dev/null; then
                git show "origin/normattiva-state:$file" > "monitor-state/$file"
              fi
            done
          else
            code=$?
            if [ "$code" -ne 2 ]; then exit "$code"; fi
          fi
          python scripts/workflow_state.py validate-state monitor-state/checkpoint.json
          if [ "$EVENT_NAME" = 'schedule' ] && python scripts/workflow_state.py already-complete monitor-state/checkpoint.json; then
            echo 'skipped=true' >> "$GITHUB_OUTPUT"
            echo 'Controllo nazionale già completato oggi; fallback non necessario.'
          else
            echo 'skipped=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Interroga Normattiva e valida i dati
        if: steps.prepare.outputs.skipped == 'false'
        run: |
          set -euo pipefail
          python scripts/normattiva.py
          python scripts/workflow_state.py validate national.json data.json update-status.json monitor-state/checkpoint.json
          python -m unittest discover -s tests -v
      - name: Pubblica stato e modifiche validate su main
        if: steps.prepare.outputs.skipped == 'false'
        id: publish
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp national.json /tmp/atlante-national.json
          cp update-status.json /tmp/atlante-status.json
          git show HEAD:national.json > /tmp/atlante-national-base.json
          for attempt in 1 2 3; do
            git fetch origin main
            git show origin/main:national.json > /tmp/atlante-national-remote.json
            if ! cmp -s /tmp/atlante-national-base.json /tmp/atlante-national.json &&
               ! cmp -s /tmp/atlante-national-base.json /tmp/atlante-national-remote.json; then
              echo 'Registro nazionale modificato in parallelo: nuovo controllo necessario' >&2
              exit 1
            fi
            git reset --hard origin/main
            if ! cmp -s /tmp/atlante-national-base.json /tmp/atlante-national.json; then
              cp /tmp/atlante-national.json national.json
            fi
            cp /tmp/atlante-status.json update-status.json
            python scripts/workflow_state.py validate national.json data.json update-status.json monitor-state/checkpoint.json
            git add national.json update-status.json
            if git diff --cached --quiet; then
              echo 'changed=false' >> "$GITHUB_OUTPUT"
              break
            fi
            git commit -m 'Registra controllo nazionale Normattiva'
            if git push origin HEAD:main; then
              echo 'changed=true' >> "$GITHUB_OUTPUT"
              break
            fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 3))
          done
      - name: Conserva stato per il deploy
        if: steps.prepare.outputs.skipped == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: normattiva-state-result
          path: |
            monitor-state/checkpoint.json
            monitor-state/events.json
            update-status.json
  deploy:
    if: needs.check.outputs.skipped == 'false'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: normattiva-state-result
      - name: Verifica stato pubblico
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SITE_URL: https://domenicoderosa26-web.github.io/atlante-idraulico/update-status.json
        run: |
          python - <<'PY'
          import json, os, time, urllib.request, urllib.error
          expected = json.load(open('update-status.json'))['last_completed_at']
          url = os.environ['SITE_URL']
          def visible():
              try:
                  with urllib.request.urlopen(url + '?v=' + str(time.time()), timeout=15) as response:
                      status = json.load(response)
                  return status.get('outcome') == 'completato' and status.get('last_completed_at') == expected
              except (OSError, ValueError):
                  return False
          for attempt in range(6):
              if visible(): break
              time.sleep(10)
          else:
              request = urllib.request.Request(
                  'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/pages/builds',
                  data=b'{}', method='POST', headers={
                      'Authorization':'Bearer ' + os.environ['GITHUB_TOKEN'],
                      'Accept':'application/vnd.github+json',
                      'X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(request, timeout=20) as response:
                  if response.status not in (200, 201, 202):
                      raise RuntimeError('Richiesta build Pages non accettata')
              for attempt in range(18):
                  if visible(): break
                  time.sleep(10)
              else:
                  raise SystemExit('Stato pubblico non verificabile dopo il build Pages')
          print('Pages serve lo stato nazionale del controllo:', expected)
          PY
  finalize:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: normattiva-state-result
      - name: Archivia checkpoint e log dopo il deploy
        run: |
          set -euo pipefail
          git fetch origin main
          if git ls-remote --exit-code origin refs/heads/normattiva-state >/dev/null; then
            git fetch origin refs/heads/normattiva-state:refs/remotes/origin/normattiva-state
          else
            code=$?
            if [ "$code" -ne 2 ]; then exit "$code"; fi
          fi
          mkdir -p /tmp/atlante-state
          cp monitor-state/checkpoint.json monitor-state/events.json /tmp/atlante-state/
          if git show-ref --verify --quiet refs/remotes/origin/normattiva-state; then
            git worktree add --detach /tmp/atlante-state-tree origin/normattiva-state
            git -C /tmp/atlante-state-tree switch -C normattiva-state
          else
            git worktree add --detach /tmp/atlante-state-tree HEAD
            git -C /tmp/atlante-state-tree switch --orphan normattiva-state
            git -C /tmp/atlante-state-tree ls-files -z | xargs -0 -r git -C /tmp/atlante-state-tree rm -rf --
          fi
          cp /tmp/atlante-state/checkpoint.json /tmp/atlante-state/events.json /tmp/atlante-state-tree/
          git -C /tmp/atlante-state-tree config user.name 'github-actions[bot]'
          git -C /tmp/atlante-state-tree config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C /tmp/atlante-state-tree add checkpoint.json events.json
          if ! git -C /tmp/atlante-state-tree diff --cached --quiet; then
            git -C /tmp/atlante-state-tree commit -m 'Registra checkpoint Normattiva'
            for attempt in 1 2 3; do
              if git -C /tmp/atlante-state-tree push origin HEAD:normattiva-state; then break; fi
              if [ "$attempt" -eq 3 ]; then exit 1; fi
              sleep $((attempt * 3))
            done
          fi
          local_sha=$(git -C /tmp/atlante-state-tree rev-parse HEAD)
          remote_sha=$(git ls-remote origin refs/heads/normattiva-state | cut -f1)
          test "$local_sha" = "$remote_sha"
