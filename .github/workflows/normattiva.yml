name: Controllo Normattiva nazionale
on:
  schedule:
    - cron: '17 7,8,9 * * *'
      timezone: Europe/Rome
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: atlante-publication
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      changed: ${{ steps.publish.outputs.changed }}
      skipped: ${{ steps.prepare.outputs.skipped }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Valida tassonomia e archivi
        run: |
          python scripts/topics.py validate data.json
          python scripts/archive.py
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Recupera stato tecnico e verifica idempotenza
        id: prepare
        env:
          SITE_URL: https://domenicoderosa26-web.github.io/atlante-idraulico/
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          mkdir -p monitor-state
          if git ls-remote --exit-code origin refs/heads/normattiva-state >/dev/null; then
            git fetch origin refs/heads/normattiva-state:refs/remotes/origin/normattiva-state
            for file in checkpoint.json events.json; do
              git show "origin/normattiva-state:$file" > "monitor-state/$file"
            done
          else
            code=$?
            if [ "$code" -ne 2 ]; then exit "$code"; fi
          fi
          python scripts/workflow_state.py validate-state monitor-state/checkpoint.json
          if [ "$EVENT_NAME" = 'schedule' ] && python scripts/workflow_state.py already-complete monitor-state/checkpoint.json update-status.json national.json; then
            echo 'skipped=true' >> "$GITHUB_OUTPUT"
            echo 'Controllo nazionale già completato oggi; fallback non necessario.'
          else
            echo 'skipped=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Interroga Normattiva e valida i dati
        if: steps.prepare.outputs.skipped == 'false'
        run: |
          set -euo pipefail
          python scripts/normattiva.py
          python scripts/workflow_state.py validate national.json data.json update-status.json monitor-state/checkpoint.json
          python -m unittest discover -s tests -v
      - name: Pubblica stato e modifiche validate su main
        if: steps.prepare.outputs.skipped == 'false'
        id: publish
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp national.json /tmp/atlante-national.json
          cp update-status.json /tmp/atlante-status.json
          git show HEAD:national.json > /tmp/atlante-national-base.json
          git show HEAD:update-status.json > /tmp/atlante-status-base.json
          for attempt in 1 2 3; do
            git fetch origin main
            git show origin/main:national.json > /tmp/atlante-national-remote.json
            git show origin/main:update-status.json > /tmp/atlante-status-remote.json
            if ! cmp -s /tmp/atlante-status-base.json /tmp/atlante-status-remote.json &&
               ! cmp -s /tmp/atlante-status.json /tmp/atlante-status-remote.json; then
              echo 'Stato nazionale modificato in parallelo: nuovo controllo necessario' >&2
              exit 1
            fi
            if ! cmp -s /tmp/atlante-national-base.json /tmp/atlante-national-remote.json; then
              echo 'Registro nazionale modificato in parallelo: nuovo controllo necessario' >&2
              exit 1
            fi
            git reset --hard origin/main
            if ! cmp -s /tmp/atlante-national-base.json /tmp/atlante-national.json; then
              cp /tmp/atlante-national.json national.json
            fi
            cp /tmp/atlante-status.json update-status.json
            python scripts/workflow_state.py validate national.json data.json update-status.json monitor-state/checkpoint.json
            python scripts/archive.py --base-ref origin/main
            git add national.json update-status.json
            if git diff --cached --quiet; then
              echo 'changed=false' >> "$GITHUB_OUTPUT"
              break
            fi
            git commit -m 'Registra controllo nazionale Normattiva'
            if git push origin HEAD:main; then
              echo 'changed=true' >> "$GITHUB_OUTPUT"
              break
            fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 3))
          done
      - name: Conserva evidenze anche in caso di errore
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: normattiva-attempt-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            monitor-state/
            update-status.json
      - name: Conserva stato per il deploy
        if: steps.prepare.outputs.skipped == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: normattiva-state-result
          path: |
            monitor-state/checkpoint.json
            monitor-state/events.json
            update-status.json
            national.json
  deploy:
    if: needs.check.outputs.skipped == 'false'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: normattiva-state-result
      - name: Verifica candidato pubblicato
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SITE_URL: https://domenicoderosa26-web.github.io/atlante-idraulico/
        run: python scripts/workflow_state.py verify-public update-status.json national.json
      - name: Conferma completamento senza sovrascrivere modifiche concorrenti
        run: |
          set -euo pipefail
          cp national.json /tmp/atlante-national-expected.json
          cp update-status.json /tmp/atlante-status-pending.json
          python scripts/workflow_state.py complete-status update-status.json
          cp update-status.json /tmp/atlante-status-completed.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git show origin/main:national.json > /tmp/atlante-national-remote.json
            git show origin/main:update-status.json > /tmp/atlante-status-remote.json
            cmp /tmp/atlante-national-expected.json /tmp/atlante-national-remote.json
            if ! cmp -s /tmp/atlante-status-pending.json /tmp/atlante-status-remote.json &&
               ! cmp -s /tmp/atlante-status-completed.json /tmp/atlante-status-remote.json; then
              echo 'Stato modificato in parallelo: conferma annullata' >&2
              exit 1
            fi
            git reset --hard origin/main
            cp /tmp/atlante-status-completed.json update-status.json
            python scripts/workflow_state.py validate national.json data.json update-status.json monitor-state/checkpoint.json
            python scripts/archive.py --base-ref origin/main
            git add update-status.json
            if git diff --cached --quiet; then break; fi
            git commit -m 'Conferma pubblicazione controllo Normattiva'
            if git push origin HEAD:main; then break; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 3))
          done
      - name: Verifica conferma pubblica e prepara ricevuta
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SITE_URL: https://domenicoderosa26-web.github.io/atlante-idraulico/
        run: |
          python scripts/workflow_state.py verify-public update-status.json national.json
          python scripts/workflow_state.py receipt monitor-state/checkpoint.json update-status.json national.json
      - uses: actions/upload-artifact@v4
        with:
          name: normattiva-published-result
          path: |
            monitor-state/checkpoint.json
            monitor-state/events.json
            update-status.json
            national.json
  finalize:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: normattiva-published-result
      - name: Archivia checkpoint e log dopo il deploy
        run: |
          set -euo pipefail
          git fetch origin main
          for file in national.json update-status.json; do
            git show "origin/main:$file" > "/tmp/atlante-confirmed-$file"
            cmp "$file" "/tmp/atlante-confirmed-$file"
          done
          if git ls-remote --exit-code origin refs/heads/normattiva-state >/dev/null; then
            git fetch origin refs/heads/normattiva-state:refs/remotes/origin/normattiva-state
          else
            code=$?
            if [ "$code" -ne 2 ]; then exit "$code"; fi
          fi
          mkdir -p /tmp/atlante-state
          cp monitor-state/checkpoint.json monitor-state/events.json /tmp/atlante-state/
          if git show-ref --verify --quiet refs/remotes/origin/normattiva-state; then
            git worktree add --detach /tmp/atlante-state-tree origin/normattiva-state
            git -C /tmp/atlante-state-tree switch -C normattiva-state
          else
            git worktree add --detach /tmp/atlante-state-tree HEAD
            git -C /tmp/atlante-state-tree switch --orphan normattiva-state
            git -C /tmp/atlante-state-tree ls-files -z | xargs -0 -r git -C /tmp/atlante-state-tree rm -rf --
          fi
          python scripts/workflow_state.py merge-state /tmp/atlante-state-tree/checkpoint.json /tmp/atlante-state/checkpoint.json /tmp/atlante-state-tree/events.json /tmp/atlante-state/events.json
          git -C /tmp/atlante-state-tree config user.name 'github-actions[bot]'
          git -C /tmp/atlante-state-tree config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C /tmp/atlante-state-tree add checkpoint.json events.json
          if ! git -C /tmp/atlante-state-tree diff --cached --quiet; then
            git -C /tmp/atlante-state-tree commit -m 'Registra checkpoint Normattiva'
            for attempt in 1 2 3; do
              if git -C /tmp/atlante-state-tree push origin HEAD:normattiva-state; then break; fi
              if [ "$attempt" -eq 3 ]; then exit 1; fi
              git -C /tmp/atlante-state-tree fetch origin refs/heads/normattiva-state:refs/remotes/origin/normattiva-state
              git -C /tmp/atlante-state-tree reset --hard origin/normattiva-state
              python scripts/workflow_state.py merge-state /tmp/atlante-state-tree/checkpoint.json /tmp/atlante-state/checkpoint.json /tmp/atlante-state-tree/events.json /tmp/atlante-state/events.json
              git -C /tmp/atlante-state-tree add checkpoint.json events.json
              if ! git -C /tmp/atlante-state-tree diff --cached --quiet; then
                git -C /tmp/atlante-state-tree commit -m 'Registra checkpoint Normattiva'
              fi
              sleep $((attempt * 3))
            done
          fi
          local_sha=$(git -C /tmp/atlante-state-tree rev-parse HEAD)
          remote_sha=$(git ls-remote origin refs/heads/normattiva-state | cut -f1)
          test "$local_sha" = "$remote_sha"
