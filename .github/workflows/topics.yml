name: Validazione argomenti canonici
on:
  push:
    branches: [main]
    paths:
      - 'data.json'
      - 'national.json'
      - 'update-status.json'
      - 'dist/**'
      - 'topic-taxonomy.json'
      - 'app.js'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/**'
      - 'index.html'
  pull_request:
    paths:
      - 'data.json'
      - 'national.json'
      - 'update-status.json'
      - 'dist/**'
      - 'topic-taxonomy.json'
      - 'app.js'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/**'
      - 'index.html'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Valida archivio unico e conservazione degli ID
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_REF" ] && [ "$BASE_REF" != '0000000000000000000000000000000000000000' ]; then
            python scripts/archive.py --base-ref "$BASE_REF"
          else
            python scripts/archive.py
          fi
      - run: python scripts/topics.py validate data.json
      - run: python -m unittest discover -s tests -v
      - run: node --check app.js
      - run: node tests/test_topic_filters.js
